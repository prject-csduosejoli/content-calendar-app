name = "kalender-konten-golden"
main = "worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

# Aset statis di folder public/ supaya source code, schema.sql, tests/ dan .git/
# TIDAK ikut ter-upload dan tidak bisa diunduh siapa pun lewat URL. wrangler tidak
# mendukung filter per-file, jadi pemisahan folder satu-satunya cara.
# PENTING: jangan taruh field lain di blok [assets] — wrangler mengabaikannya
# diam-diam dan Worker tetap jalan tanpa binding (storage "none").
[assets]
directory = "./public"
not_found_handling = "none"

# Binding D1. Dibuat 2026-09-28 lewat `npx wrangler d1 create`.
# Kalau Worker tidak jalan: cek /health, storage harus "cloudflare-d1" bukan "none".
[[d1_databases]]
binding = "DB"
database_name = "kalender-konten-golden"
database_id = "402a6bbd-e141-439d-a470-a9b5c18e6637"
