<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Content Calendar - Golden Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
                color: black !important;
            }
            .shadow-sm, .shadow-md, .shadow-lg {
                box-shadow: none !important;
            }
            .grid-cols-7 {
                display: grid !important;
                grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
            }
            .h-28 {
                height: 90px !important;
            }
            input, textarea {
                border: none !important;
                background: transparent !important;
                resize: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight uppercase">Monthly Content Calendar</h1>
                <p class="text-slate-500 text-sm">Golden Studio (goldenstudio.id) & ShareUndangan</p>
            </div>
            <div class="flex items-center gap-3 no-print">
                <input type="month" id="currentMonthPicker" class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-slate-700 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="changeMonth(this.value)">
                <button onclick="loadSeptemberData()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl font-medium shadow-sm transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-calendar-check"></i> Load Plan Oktober 2026
                </button>
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-medium shadow-sm transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-file-pdf"></i> Cetak / PDF
                </button>
                <button onclick="saveData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-medium shadow-sm transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Calendar Grid (3 Cols) -->
            <div class="lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm flex flex-col">
                <div class="grid grid-cols-7 gap-2 mb-4 text-center">
                    <div class="font-bold text-slate-600 text-sm">Minggu</div>
                    <div class="font-bold text-slate-600 text-sm">Senin</div>
                    <div class="font-bold text-slate-600 text-sm">Selasa</div>
                    <div class="font-bold text-slate-600 text-sm">Rabu</div>
                    <div class="font-bold text-slate-600 text-sm">Kamis</div>
                    <div class="font-bold text-slate-600 text-sm">Jumat</div>
                    <div class="font-bold text-slate-600 text-sm">Sabtu</div>
                </div>
                <div id="calendarDays" class="grid grid-cols-7 gap-2 flex-1">
                    <!-- Dynamic Days -->
                </div>
            </div>

            <!-- Sidebar (1 Col) -->
            <div class="space-y-6">
                <!-- Important Dates -->
                <div class="bg-white p-5 rounded-2xl shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Important Dates</h2>
                        <button onclick="addEventRow()" class="text-blue-600 hover:text-blue-700 text-xs font-semibold no-print">+ Tambah</button>
                    </div>
                    <div id="importantDatesList" class="space-y-2">
                        <!-- Dynamic rows -->
                    </div>
                </div>

                <!-- Goals / To-Do List -->
                <div class="bg-white p-5 rounded-2xl shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Goals / To-Do</h2>
                        <button onclick="addToDoItem()" class="text-blue-600 hover:text-blue-700 text-xs font-semibold no-print">+ Tambah</button>
                    </div>
                    <div id="todoList" class="space-y-2">
                        <!-- Dynamic items -->
                    </div>
                </div>

                <!-- Notes -->
                <div class="bg-white p-5 rounded-2xl shadow-sm">
                    <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider mb-3">Notes</h2>
                    <textarea id="appNotes" rows="4" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tulis catatan penting..."></textarea>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Edit Content -->
    <div id="contentModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="font-bold text-lg text-slate-800" id="modalTitle">Edit Tanggal</h3>
            <textarea id="modalContentInput" rows="3" class="w-full border border-slate-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Judul / Topik Konten / CTA"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium">Batal</button>
                <button onclick="saveModalContent()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        let currentYear = 2026;
        let currentMonth = 9; // Oktober (bulan kerja berjalan)

        let state = JSON.parse(localStorage.getItem('content_calendar_state')) || {
            calendar: {},
            dates: [{ date: '2026-10-10', event: 'Mid-Month Special Campaign' }],
            todos: ['Ide Konten : Sesi keluarga atau lamaran beauti', 'Ide Konten : Sesi prewedding bertema nasional'],
            notes: 'Fokus trafik website goldenstudio.id & konversi ShareUndangan.'
        };

        let activeDay = null;

        function initPicker() {
            let mStr = (currentMonth + 1) < 10 ? '0' + (currentMonth + 1) : (currentMonth + 1);
            document.getElementById('currentMonthPicker').value = `${currentYear}-${mStr}`;
        }

        function changeMonth(val) {
            let parts = val.split('-');
            currentYear = parseInt(parts[0]);
            currentMonth = parseInt(parts[1]) - 1;
            renderCalendar();
        }

        function loadSeptemberData() {
            currentYear = 2026;
            currentMonth = 9; // Oktober
            initPicker();
            
            // Oktober 2026 Plan Mapping
            state.calendar = {
                "2026-10-01": "- Hari Kesaktian Pancasila - Hari Lansia Internasional - Hari Kopi",
                "2026-10-02": "Hari Batik Nasional & Hari Batik Dunia",
                "2026-10-05": "- HUT ke-81 TNI - Hari Guru Sedunia - Hari Habitat Sedunia",
                "2026-10-08": "Hari Tata Ruang Nasional",
                "2026-10-12": "Hari Museum Nasional",
                "2026-10-16": "- Hari Parlemen Indonesia - Hari Pangan Sedunia",
                "2026-10-22": "- Hari Santri Nasional",
                "2026-10-24": "- Hari Dokter Indonesia",
                "2026-10-27": "- Hari Penerbangan Nasional - Hari Listrik Nasional",
                "2026-10-28": "- Hari Sumpah Pemuda",
                "2026-10-30": "- Hari Keuangan Nasional"
            };
            renderCalendar();
            renderSidebar();
            alert('Plan Konten Oktober 2026 berhasil dimuat ke kalender!');
        }

        function renderCalendar() {
            const container = document.getElementById('calendarDays');
            container.innerHTML = '';
            
            let firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for(let i=0; i<firstDayIndex; i++) {
                container.innerHTML += `<div class="h-32 bg-slate-50/50 rounded-xl border border-dashed border-slate-200"></div>`;
            }

            for(let d=1; d<=totalDays; d++) {
                let mFormatted = (currentMonth + 1) < 10 ? '0' + (currentMonth + 1) : (currentMonth + 1);
                let dFormatted = d < 10 ? '0' + d : d;
                let dayKey = `${currentYear}-${mFormatted}-${dFormatted}`;
                
                let content = state.calendar[dayKey] || '';
                container.innerHTML += `
                    <div onclick="openModal('${dayKey}')" class="h-32 bg-white border border-slate-200 rounded-xl p-2 flex flex-col justify-between hover:border-blue-500 cursor-pointer transition group relative overflow-hidden">
                        <span class="font-bold text-xs text-slate-400 group-hover:text-blue-600">${d}</span>
                        <div class="flex-1 overflow-y-auto my-1">
                            ${content ? `<span class="bg-amber-100 text-amber-900 text-[11px] font-semibold block p-1.5 rounded leading-tight">${content}</span>` : ''}
                        </div>
                    </div>
                `;
            }
        }

        function renderSidebar() {
            const datesContainer = document.getElementById('importantDatesList');
            datesContainer.innerHTML = '';
            state.dates.forEach((item, idx) => {
                datesContainer.innerHTML += `
                    <div class="flex gap-2 items-center">
                        <input type="text" value="${item.date}" onchange="updateDate(${idx}, 'date', this.value)" class="w-24 bg-slate-50 border border-slate-200 p-1.5 rounded-lg text-xs">
                        <input type="text" value="${item.event}" onchange="updateDate(${idx}, 'event', this.value)" class="flex-1 bg-slate-50 border border-slate-200 p-1.5 rounded-lg text-xs">
                        <button onclick="removeDate(${idx})" class="text-rose-500 hover:text-rose-700 text-xs no-print"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            const todoContainer = document.getElementById('todoList');
            todoContainer.innerHTML = '';
            state.todos.forEach((item, idx) => {
                todoContainer.innerHTML += `
                    <div class="flex gap-2 items-center">
                        <input type="text" value="${item}" onchange="updateTodo(${idx}, this.value)" class="flex-1 bg-slate-50 border border-slate-200 p-1.5 rounded-lg text-xs">
                        <button onclick="removeTodo(${idx})" class="text-rose-500 hover:text-rose-700 text-xs no-print"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            document.getElementById('appNotes').value = state.notes || '';
        }

        function openModal(dayKey) {
            activeDay = dayKey;
            document.getElementById('modalTitle').innerText = `Edit Konten: ${dayKey}`;
            document.getElementById('modalContentInput').value = state.calendar[dayKey] || '';
            document.getElementById('contentModal').classList.remove('hidden');
            document.getElementById('contentModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('contentModal').classList.remove('flex');
            document.getElementById('contentModal').classList.add('hidden');
        }

        function saveModalContent() {
            let val = document.getElementById('modalContentInput').value;
            if(val) {
                state.calendar[activeDay] = val;
            } else {
                delete state.calendar[activeDay];
            }
            closeModal();
            renderCalendar();
        }

        function addEventRow() {
            let todayStr = '2026-10-01';
            state.dates.push({date: todayStr, event: ''});
            renderSidebar();
        }

        function updateDate(idx, field, val) {
            state.dates[idx][field] = val;
        }

        function removeDate(idx) {
            state.dates.splice(idx, 1);
            renderSidebar();
        }

        function addToDoItem() {
            state.todos.push('');
            renderSidebar();
        }

        function updateTodo(idx, val) {
            state.todos[idx] = val;
        }

        function removeTodo(idx) {
            state.todos.splice(idx, 1);
            renderSidebar();
        }

        function saveData() {
            state.notes = document.getElementById('appNotes').value;
            localStorage.setItem('content_calendar_state', JSON.stringify(state));
            alert('Data berhasil disimpan!');
        }

        // Init
        initPicker();
        renderCalendar();
        renderSidebar();
    </script>
</body>
</html>
